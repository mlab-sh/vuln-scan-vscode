name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Ensure the extension actually packages (no missing files, valid manifest).
      - run: npx --no-install @vscode/vsce package --no-dependencies -o vuln-scan.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vuln-scan.vsix
